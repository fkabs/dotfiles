# Sets the starship format
format = """
$username\
$hostname\
$directory\
([](fg:overlay)${git_branch}${git_status}${git_metrics}[](fg:overlay) )\
$fill\
$python\
$time\
$character
"""


# Sets user-defined palette
palette = "rose-pine-moon"

[character]
format = "\n $symbol "
success_symbol = '[I](fg:iris)'
error_symbol = "[I](fg:love)"
vimcmd_symbol = "[N](fg:iris)"
vimcmd_replace_one_symbol = "[R](fg:iris)"
vimcmd_replace_symbol = "[r](fg:iris)"
vimcmd_visual_symbol = "[V](fg:iris)"

[directory]
format = "[](fg:overlay)[ $path]($style)[](fg:overlay) "
style = "bg:overlay fg:pine"
truncation_length = 2
fish_style_pwd_dir_length = 2
truncation_symbol = "…/"
use_os_path_sep = false

[fill]
style = "fg:overlay"
symbol = " "

[git_branch]
format = "[$symbol$branch]($style)"
style = "bg:overlay fg:foam"
symbol = " "

[git_status]
disabled = false
style = "bg:overlay fg:foam"
format = '([ $all_status$ahead_behind]($style))'
up_to_date = '(bg:overlay fg:iris)'
untracked = '[?\($count\)](bg:overlay fg:gold)'
stashed = '[\$](bg:overlay fg:iris)'
typechanged = '[T](bg:overlay fg:iris)'
modified = '[!\($count\)](bg:overlay fg:gold)'
renamed = '[»\($count\)](bg:overlay fg:iris)'
deleted = '[✘\($count\)](bg:overlay fg:love)'
conflicted = '[=\($count\)](bg:overlay fg:love)'
staged = '[++\($count\)](bg:overlay fg:gold)'
ahead = '[⇡\(${count}\)](bg:overlay fg:foam)'
diverged = '⇕[\[](bg:overlay fg:iris)[⇡\(${ahead_count}\) ](bg:overlay fg:foam)[⇣\(${behind_count}\)](bg:overlay fg:rose)[\]](bg:overlay fg:iris)'
behind = '[⇣\(${count}\)](bg:overlay fg:rose)'

[git_metrics]
disabled = false
added_style = "bg:overlay fg:iris"
deleted_style = "bg:overlay fg:love"
only_nonzero_diffs = true
# brackets only render when added or deleted is non-empty; no separator between the counts (colors tell them apart)
format = '([ \[](bg:overlay fg:subtle)([+$added]($added_style))([-$deleted]($deleted_style))[\]](bg:overlay fg:subtle))'

[time]
disabled = false
format = " [](fg:overlay)[$time 󰴈]($style)[](fg:overlay)"
style = "bg:overlay fg:rose"
time_format = "%H:%M"
use_12hr = false

[username]
disabled = false
format = "[](fg:overlay)[󰧱 $user(@$hostname)]($style)[](fg:overlay) "
show_always = true
style_root = "bg:overlay fg:iris"
style_user = "bg:overlay fg:iris"

[hostname]
disabled = false
format = "[](fg:overlay)[$ssh_symbol$hostname]($style)[](fg:overlay) "
ssh_only = true
style = "bg:overlay fg:gold"
ssh_symbol = " "

